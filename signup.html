<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | عسير</title>
  <link rel="stylesheet" href="style.css?v=204">
</head>
<body data-page="signup" data-no-header="1" data-no-footer="1">

  <main class="lg-page" id="main">
    <div class="lg-bg" aria-hidden="true">
      <img src="assets/img/signup/bg.jpg" alt="">
    </div>

    <a class="lg-back" href="index.html">العودة للرئيسية ←</a>

    <a class="lg-logo" href="index.html" aria-label="عسير">
      <img class="lg-logo__mark" src="assets/img/logo-mark.png" width="43" height="43" alt="">
      <span class="lg-logo__word">
        <span class="lg-logo__ar">عسير</span>
        <span class="lg-logo__en">A S E E R</span>
      </span>
    </a>

    <section class="lg-card lg-card--signup" aria-labelledby="su-title">
      <h1 id="su-title">إنشاء حساب جديد</h1>
      <p class="lg-card__sub">انضم إلينا وابدأ التخطيط لرحلتك في عسير</p>

      <form class="lg-form" data-auth-form>
        <label class="lg-field">
          <span>الاسم الكامل</span>
          <input type="text" name="name" required autocomplete="name" value="أحمد محمد العسيري">
        </label>

        <label class="lg-field">
          <span>البريد الإلكتروني</span>
          <input type="email" name="email" required autocomplete="email" value="ahmed.alasiri@email.com" dir="ltr">
        </label>

        <label class="lg-field">
          <span>رقم الجوال</span>
          <input type="tel" name="phone" required autocomplete="tel" value="+966 55 123 4567" dir="ltr">
        </label>

        <label class="lg-field">
          <span>كلمة المرور</span>
          <input type="password" name="password" required autocomplete="new-password" value="password123" dir="ltr">
        </label>

        <label class="lg-field">
          <span>تأكيد كلمة المرور</span>
          <input type="password" name="password_confirm" required autocomplete="new-password" value="password123" dir="ltr">
        </label>

        <label class="lg-check">
          <input type="checkbox" name="terms" required checked>
          <span>أوافق على الشروط وسياسة الخصوصية</span>
        </label>

        <button class="lg-btn lg-btn--gold" type="submit">إنشاء الحساب</button>
      </form>

      <p class="lg-foot">
        لديك حساب بالفعل؟
        <a href="login.html">تسجيل الدخول</a>
      </p>
    </section>
  </main>

  <script src="script.js?v=63"></script>
</body>
</html>
